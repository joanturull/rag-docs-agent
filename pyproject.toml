[project]
name = "rag-docs-agent"
version = "0.1.0"
description = "Ask questions about your own documents and get answers with source citations. FastAPI + Claude API, containerised and deployed on Cloud Run."
readme = "README.md"
authors = [
    { name = "Joan Turull", email = "joanturull4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.3.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
rag-agent = "rag_docs_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
